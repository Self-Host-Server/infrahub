---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# Our own extension (not from opsmill/schema-library): adds the Proxmox node and the
# attributes ipam-sync needs to track where IPAM data came from.
version: "1.0"

nodes:
  - name: Node
    namespace: Proxmox
    description: A Proxmox VE hypervisor node, able to host virtual machines.
    label: Proxmox Node
    icon: mdi:server-network
    include_in_menu: true
    inherit_from:
      - VirtualizationHostVirtualMachine
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: managed_by
        kind: Text
        optional: true
        order_weight: 1100

extensions:
  nodes:
    - kind: VirtualizationVirtualMachine
      attributes:
        - name: managed_by
          kind: Text
          optional: true
    - kind: InterfaceVirtual
      attributes:
        - name: managed_by
          kind: Text
          optional: true
    - kind: IpamPrefix
      attributes:
        - name: managed_by
          kind: Text
          optional: true
    - kind: IpamIPAddress
      attributes:
        - name: managed_by
          kind: Text
          optional: true
        - name: mac_address
          kind: Text
          optional: true
        - name: last_seen
          kind: DateTime
          optional: true
